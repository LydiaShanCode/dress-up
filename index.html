<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dress Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="app">
      <aside id="panel" aria-label="Your measurements">
        <header>
          <p class="overline">Dress Up</p>
          <h1>Your measurements</h1>
          <p id="summary" class="summary"></p>
        </header>
        <form id="fields" autocomplete="off" onsubmit="return false"></form>
        <footer>
          <p class="note">✓ means the 3D body measures exactly your number. The weight column shows what the body's volume would weigh.</p>
          <button id="reset" type="button" class="secondary">Reset to my measurements</button>
        </footer>
      </aside>
      <section id="stage" aria-label="3D body">
        <nav class="toolbar" aria-label="View">
          <button data-view="0">Front</button>
          <button data-view="90">Side</button>
          <button data-view="180">Back</button>
          <button id="spin" aria-pressed="false">Turntable</button>
          <button id="guides" aria-pressed="false">Measurements</button>
        </nav>
        <p id="loading" class="loading" role="status">Building your body…</p>
        <p class="hint">Drag to turn · Scroll to zoom</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
