<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dress Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="look-app">
      <aside class="look-panel" aria-label="Your measurements">
        <header>
          <p class="overline">Dress Up</p>
          <h1>You, as the model</h1>
          <p class="summary" id="summary"></p>
        </header>
        <dl id="measurements" class="measure-list"></dl>
        <footer>
          <p class="note">Your model is made from these measurements and photographed with your face, hair and skin tone.</p>
        </footer>
      </aside>

      <section class="look-stage" aria-label="Your model">
        <figure class="look">
          <div class="model" id="model">
            <canvas class="base" id="model-canvas" role="img" aria-label="You as a full-length model"></canvas>
          </div>
          <figcaption id="look-caption"></figcaption>
        </figure>
        <nav class="closet" id="closet" aria-label="Closet"></nav>
      </section>
    </main>
    <script type="module" src="/src/look.js"></script>
  </body>
</html>
